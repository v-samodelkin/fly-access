name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py'
  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swiftc -swift-version 5 -typecheck -framework Cocoa FlyMenu.swift
